apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-server-route
  namespace: prj-go-server
spec:
  parentRefs:
    - name: gateway
      namespace: prj-go-server
  hostnames:
    - "kind.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/app"
      backendRefs:
        - name: go-service
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-server-route
  namespace: prj-go-server
spec:
  parentRefs:
    - name: gateway
      namespace: prj-go-server
  hostnames:
    - "kind.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/web"
      backendRefs:
        - name: nginx-service
          port: 8081

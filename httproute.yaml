apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-echo-route
  namespace: prj-go-server
spec:
  parentRefs:
    - name: gateway
      namespace: prj-go-server
  hostnames:
    - "kind.local"
  rules:
    - backendRefs:
        # mandatory matching service name
        - name: go-service
          port: 8080

